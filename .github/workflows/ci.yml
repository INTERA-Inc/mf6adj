name: mf6adj continuous integration

on: 
  schedule:
    - cron: '0 8 * * *' # run at 8 AM UTC (12 AM PST, 8 PM NZST)
  push:
    paths-ignore:
      - '**.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/docs.yml'
      - '.gitignore'
      - 'CITATION.cff'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/docs.yml'
      - '.gitignore'
      - 'CITATION.cff'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check --strict dist/*

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.69.0

      - name: Check python lint
        run: pixi run check-lint

      - name: Check python format
        run: pixi run check-format

      - name: Check spelling
        run: pixi run check-spelling

  mf6adjCI:
    name: autotest
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] 
        environment: [default]
        task: [autotest-base]
        run-type: [std]
        test-path: ["."]
        # the second python version is tested on one platform, and without the
        # tests marked slow. What it can catch is a change in the language or
        # in a dependency built against it; neither is particular to an
        # operating system, and neither needs the largest model to show.
        include:
          - os: ubuntu-latest
            environment: py312
            task: autotest-quick
            run-type: std
            test-path: "."
    defaults:
      run:
        shell: bash
    
    steps:
    - name: Checkout repo
      uses:  actions/checkout@v7 

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: v0.69.0
        environments: ${{ matrix.environment }}

    - name: pixi post-install
      run: |
        pixi run -e ${{ matrix.environment }} postinstall

    - name: Update flopy
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
      run: |
        pixi run -e ${{ matrix.environment }} update-flopy
        
    - name: Install executables
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
      run: |
        pixi run -e ${{ matrix.environment }} install-executables        

    - name: Autotest ${{ matrix.os }}-${{ matrix.environment }}
      run: |
        pixi run -e ${{ matrix.environment }} ${{ matrix.task }} 

    - name: Test notebooks ${{ matrix.os }}-${{ matrix.environment }}
      run: |
        pixi run -e ${{ matrix.environment }} autotest-notebooks
