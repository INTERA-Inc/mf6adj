name: mf6adj continuous integration

on: 
  schedule:
    - cron: '0 8 * * *' # run at 8 AM UTC (12 AM PST, 8 PM NZST)
  push:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check --strict dist/*

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.41.4

      - name: Custom pixi install
        working-directory: modflow6
        run: pixi run install

      - name: Check python lint
        run: pixi run check-python-lint

      - name: Check python format
        run: pixi run check-python-format

      - name: Check spelling
        run: pixi run check-spelling

  mf6adjCI:
    name: autotest
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] 
        run-type: [std]
        test-path: ["."]
    defaults:
      run:
        shell: bash
    
    steps:
    - name: Checkout repo
      uses:  actions/checkout@v3 

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.9.2
      with:
        pixi-version: v0.41.4

    - name: Custom pixi install
      working-directory: modflow6
      run: pixi run install

    - name: Install executables
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
      run: |
        pixi run install-executables

    - name: Autotest ${{ matrix.os }}-python${{ matrix.python-version }}
      run: |
        pixi run autotest-base 

    - name: Test notebooks ${{ matrix.os }}-python${{ matrix.python-version }}
      run: |
        pixi run autotest-notebooks
