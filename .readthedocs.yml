version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - pandoc
    # the supplemental technical information document is built with LaTeX
    - texlive-latex-base
    - texlive-latex-recommended
    - texlive-fonts-recommended
    - texlive-binaries
  jobs:
    pre_build:
      - python scripts/sphinx_prepare_notebooks.py --skip-if-exist
      - python scripts/sphinx_apidoc.py
      - python scripts/build_suppinfo.py

sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc

formats:
  - htmlzip
