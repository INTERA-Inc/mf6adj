name: docs

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      ref:
        description: 'The tag, branch or commit hash to trigger an RTD build for. Branches and tags must be fully formed, e.g. refs/heads/<branch> or refs/tags/<tag> respectively.'
        required: false
        type: string
        default: 'refs/heads/develop'
      mf6_ref:
        description: 'The tag, branch or commit hash to build MF6 from. Branches and tags must be fully formed, e.g. refs/heads/<branch> or refs/tags/<tag> respectively.'
        required: false
        type: string
        default: 'refs/heads/develop'

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.59.0

      - name: pixi post-install
        run: |
          pixi run postinstall

      - name: Update flopy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
        run: |
          pixi run update-flopy
          
      - name: Install executables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pixi run install-executables

      - name: Run notebooks
        run: |
          pixi run docs-build-exec

      - name: Package notebooks artifact
        run: |
          mkdir -p docs/_build/artifacts
          cd examples
          zip -r ../docs/_build/artifacts/notebooks.zip *.ipynb

      - name: Upload notebooks artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-for-${{ github.sha }}
          path: docs/_build/artifacts/notebooks.zip

      - name: Build HTML docs
        run: pixi run docs-build

      - name: Package HTML docs (htmlzip)
        run: |
          mkdir -p docs/_build/htmlzip
          cd docs/_build/html
          zip -r ../htmlzip/mf6adj.zip .

      - name: Verify htmlzip artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          zip_path = Path("docs/_build/htmlzip/mf6adj.zip")
          if not zip_path.exists():
              raise SystemExit(f"Missing artifact: {zip_path}")
          if zip_path.stat().st_size == 0:
              raise SystemExit(f"Empty artifact: {zip_path}")

          with zipfile.ZipFile(zip_path) as zf:
              if not zf.namelist():
                  raise SystemExit(f"No files in artifact: {zip_path}")
              bad_file = zf.testzip()
              if bad_file is not None:
                  raise SystemExit(f"Corrupt zip entry: {bad_file}")

          print(f"Verified artifact: {zip_path}")
          PY

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Upload docs htmlzip artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-htmlzip
          path: docs/_build/htmlzip/mf6adj.zip

  trigger_rtd:
    name: Trigger Read the Docs build
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Checkout MODFLOW6 examples repo
        uses: actions/checkout@v6

      - name: Trigger RTD build
        uses: dfm/rtds-action@v1
        with:
          webhook_url: ${{ secrets.RTDS_WEBHOOK_URL }}
          webhook_token: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
          commit_ref: ${{ needs.build-docs.outputs.ref }}