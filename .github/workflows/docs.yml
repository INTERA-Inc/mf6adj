name: docs

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.59.0

      - name: pixi post-install
        run: |
          pixi run postinstall

      - name: Update flopy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
        run: |
          pixi run update-flopy
          
      - name: Install executables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
        run: |
          pixi run install-executables        

      - name: Build HTML docs
        run: pixi run docs-build-exec

      - name: Package HTML docs (htmlzip)
        run: |
          mkdir -p docs/_build/htmlzip
          cd docs/_build/html
          zip -r ../htmlzip/mf6adj.zip .

      - name: Verify htmlzip artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          zip_path = Path("docs/_build/htmlzip/mf6adj.zip")
          if not zip_path.exists():
              raise SystemExit(f"Missing artifact: {zip_path}")
          if zip_path.stat().st_size == 0:
              raise SystemExit(f"Empty artifact: {zip_path}")

          with zipfile.ZipFile(zip_path) as zf:
              if not zf.namelist():
                  raise SystemExit(f"No files in artifact: {zip_path}")
              bad_file = zf.testzip()
              if bad_file is not None:
                  raise SystemExit(f"Corrupt zip entry: {bad_file}")

          print(f"Verified artifact: {zip_path}")
          PY

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Upload docs htmlzip artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-htmlzip
          path: docs/_build/htmlzip/mf6adj.zip

  trigger_rtd:
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      # ... steps to download artifact if needed for the trigger script ...
      - name: Trigger Read the Docs build
        # Use a community action or curl command to trigger a webhook
        # Example using curl to call the RtD API
        run: |
          curl -X POST -d '{"trigger_id": "..."}' https://api.readthedocs.com
