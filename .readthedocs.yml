version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - pandoc
  jobs:
    pre_build:
      - python scripts/sphinx_prepare_notebooks.py
      - python scripts/sphinx_apidoc.py

sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc

formats:
  - htmlzip
